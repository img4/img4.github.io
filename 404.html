<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Redirecting...</title>
	<script>
		const targetDomain = "https://img6.pages.dev";
		const path = window.location.pathname.replace(/\/index\.html$/, '') || '/';
		window.location.replace(targetDomain + path + window.location.search + window.location.hash);
	</script>
</head>
<body>
	<p>Redirecting to <a id="redirect-link" href="https://img6.pages.dev">img6.pages.dev</a>...</p>
	<script>
		const dest = "https://img6.pages.dev" + (window.location.pathname.replace(/\/index\.html$/, '') || '/') + window.location.search + window.location.hash;
		document.getElementById("redirect-link").href = dest;
	</script>
</body>
</html>
